<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nível do Herói</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

        <div id="card">

            <!-- TELA 01 -->
            <section id="cadastro">

                <h1>Nível do Herói</h1>

                <form id="formHeroi">

                    <div>
                        <label for="nomeHeroi">Nome do HERÓI</label>
                        <input
                            type="text"
                            id="nomeHeroi"
                            placeholder="Digite o nome do HERÓI"
                        >
                    </div>

                    <div>
                        <label for="xpHeroi">XP do HERÓI</label>
                        <input
                            type="number"
                            id="xpHeroi"
                            placeholder="Digite o XP"
                        >
                    </div>

                    <button type="submit">
                        ENVIAR
                    </button>

                </form>

            </section>

            <!-- TELA 02 -->
            <section id="resultado">

                <h2>Resultado</h2>

                <p id="mensagemHeroi"></p>

                <button id="novoHeroi">
                    Pesquisar Novo HERÓI
                </button>

            </section>

        </div>

    </main>
<script src="scripts.js"></script>
</body>
</html>
